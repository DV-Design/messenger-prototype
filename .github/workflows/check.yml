name: check
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  prototype:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npx playwright install --with-deps chrome
      - run: npm run test:e2e
  android-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: npm ci
      - name: Generate internal Android preview
        run: npm run native:prebuild -w @messenger/mobile -- --platform android
        env:
          CI: '1'
          MESSENGER_ALLOW_LOCAL_HTTP: '1'
      - name: Build standalone preview APK
        working-directory: apps/mobile/android
        run: ./gradlew :app:assembleRelease --no-daemon --max-workers=2 -PreactNativeArchitectures=arm64-v8a
        env:
          NODE_ENV: production
          EXPO_PUBLIC_ALLOW_LOCAL_HTTP: '1'
      - name: Verify final APK call permissions and standalone metadata
        run: |
          APK=apps/mobile/android/app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify "$APK"
          "$ANDROID_HOME/build-tools/37.0.0/aapt2" dump badging "$APK" > apk-metadata.txt
          rg -F "uses-permission: name='android.permission.CAMERA'" apk-metadata.txt
          rg -F "uses-permission: name='android.permission.RECORD_AUDIO'" apk-metadata.txt
          rg -F "application-label:'LastCall'" apk-metadata.txt
          rg -F "native-code: 'arm64-v8a'" apk-metadata.txt
          unzip -l "$APK" | rg 'assets/index.android.bundle'
      - uses: actions/upload-artifact@v4
        with:
          name: LastCall-preview-android-arm64
          path: apps/mobile/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 14
