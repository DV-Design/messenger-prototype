# REST HMAC authentication secret is injected into a private tmpfs config at startup.
listening-port=3478
listening-ip=0.0.0.0
min-port=49160
max-port=49200
realm=messenger-local
fingerprint
use-auth-secret
no-cli
no-tls
no-dtls
no-tcp-relay
no-multicast-peers
no-software-attribute
user-quota=4
total-quota=32
max-bps=1048576
bps-capacity=8388608
stale-nonce=600
log-file=stdout
simple-log
no-stdout-log
