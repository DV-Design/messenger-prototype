# Public IPv4 preview. NAT mapping and secret are added only to a private tmpfs file.
listening-port=3478
tls-listening-port=5349
min-port=49160
max-port=49200
realm=p2p.lienad.ru
server-name=p2p.lienad.ru
fingerprint
use-auth-secret
cert=/run/coturn-tls/fullchain.pem
pkey=/run/coturn-tls/privkey.pem
cipher-list=HIGH:!aNULL:!MD5:!3DES
no-dtls
# Client-to-TURN TCP/TLS remains enabled; peer relay sockets are UDP (RFC5766).
no-tcp-relay
no-cli
no-multicast-peers
no-software-attribute
user-quota=4
total-quota=32
max-bps=262144
bps-capacity=8388608
stale-nonce=600
max-allocate-lifetime=600
max-allocate-timeout=15
relay-threads=1
pidfile=/tmp/turnserver.pid
log-file=stdout
simple-log
no-stdout-log
# No allowed-peer-ip overrides. Block access to private/host/service networks.
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.0.0.0-192.0.0.255
denied-peer-ip=192.0.2.0-192.0.2.255
denied-peer-ip=192.88.99.0-192.88.99.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=198.18.0.0-198.19.255.255
denied-peer-ip=198.51.100.0-198.51.100.255
denied-peer-ip=203.0.113.0-203.0.113.255
denied-peer-ip=224.0.0.0-239.255.255.255
denied-peer-ip=240.0.0.0-255.255.255.255
# This deployment has no IPv6 relay/listener/NAT mapping; reject IPv6 peer targets.
denied-peer-ip=::-ffff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
