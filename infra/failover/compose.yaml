# Mac side of the Italy-primary setup (see README.md). The router takes the name Caddy already
# uses (messenger-signaling:8787) and forwards to the Italian server through a restricted SSH
# tunnel, or to the local standby server (messenger-local) when the watchdog has promoted it.
services:
  tunnel:
    image: alpine:3.22
    container_name: lastcall-tunnel
    command:
      - sh
      - -c
      - |
        apk add --no-cache openssh-client >/dev/null
        while true; do
          ssh -i /keys/id_ed25519 -o IdentitiesOnly=yes -o UserKnownHostsFile=/keys/known_hosts \
            -o StrictHostKeyChecking=yes -o ExitOnForwardFailure=yes -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=3 -o ConnectTimeout=10 -N \
            -L 0.0.0.0:8787:127.0.0.1:8787 lastcall-relay@80.211.139.213
          sleep 5
        done
    volumes:
      - ${LASTCALL_TUNNEL_KEYS:?keys directory}:/keys:ro
    networks: [proxy]
    restart: unless-stopped
    mem_limit: 64m
    logging: { driver: json-file, options: { max-size: 2m, max-file: '2' } }
  router:
    image: nginx:1.29-alpine
    container_name: messenger-router
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ${LASTCALL_FAILOVER_STATE:?state directory}/upstream.conf:/etc/nginx/upstream.conf:ro
    networks:
      proxy:
        aliases: [messenger-signaling]
    restart: unless-stopped
    mem_limit: 64m
    logging: { driver: json-file, options: { max-size: 2m, max-file: '2' } }
networks:
  proxy:
    external: true
    name: proxy
