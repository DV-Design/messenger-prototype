worker_processes 1;
events { worker_connections 2048; }
http {
  access_log off;
  # Docker's DNS, so a restarted container is found again.
  resolver 127.0.0.11 valid=10s ipv6=off;
  map $http_upgrade $connection_upgrade { default upgrade; '' close; }
  # upstream.conf names the active server: lastcall-tunnel:8787 (Italy) or messenger-local:8787.
  include /etc/nginx/upstream.conf;
  server {
    listen 8787;
    client_max_body_size 1m;
    location / {
      proxy_pass http://lastcall_active;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      # Caddy already set the real client address; the server walks this list past trusted proxies.
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_read_timeout 1h;
      proxy_send_timeout 1h;
      proxy_connect_timeout 5s;
    }
  }
}
