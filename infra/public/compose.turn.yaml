# Opt-in standalone relay. Never attach it to the shared proxy/application network.
# See TURN.md; use --env-file infra/.env.public-turn and --profile turn explicitly.
services:
  coturn:
    profiles: [turn]
    image: coturn/coturn:4.7.0
    container_name: lastcall-coturn
    user: "${TURN_RUN_UID:-501}:${TURN_RUN_GID:-20}"
    entrypoint: [/bin/sh, /local/start-public-turn.sh]
    environment:
      TURN_SHARED_SECRET: ${TURN_SHARED_SECRET:?Set the private REST auth secret}
      TURN_EXTERNAL_IP: ${TURN_EXTERNAL_IP:?Set the current public IPv4 address}
      TURN_TLS_DIR: ${TURN_TLS_DIR:?Set an existing absolute private certificate directory}
    volumes:
      - type: bind
        source: ../coturn/public-turnserver.conf
        target: /local/public-turnserver.conf
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ../coturn/start-public-turn.sh
        target: /local/start-public-turn.sh
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${TURN_TLS_DIR:?Set the certificate directory}
        target: /run/coturn-tls
        read_only: true
        bind: {create_host_path: false}
    ports:
      - 0.0.0.0:3478:3478/udp
      - 0.0.0.0:3478:3478/tcp
      - 0.0.0.0:5349:5349/tcp
      - 0.0.0.0:49160-49200:49160-49200/udp
    networks: [turn]
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=16m,mode=1777"]
    init: true
    cap_drop: [ALL]
    # The upstream executable has this file capability; keep it in the bounding set.
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    pids_limit: 64
    mem_limit: 128m
    cpus: 1.0
    ulimits:
      nofile: {soft: 2048, hard: 2048}
    restart: unless-stopped
    healthcheck:
      # Process liveness only. This does not prove a reachable allocation or relay.
      test: [CMD-SHELL, 'test -s /tmp/turnserver.pid && kill -0 "$$(cat /tmp/turnserver.pid)"']
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options: {max-size: 5m, max-file: '2'}
networks:
  turn:
    driver: bridge
    enable_ipv6: false
